<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combination Lab Frontend</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      code { background: #f5f5f5; padding: 0.1rem 0.3rem; border-radius: 4px; }
      .row { display: flex; gap: 2rem; flex-wrap: wrap; }
      .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; width: 320px; }
    </style>
  </head>
  <body>
    <h1>Combination Lab</h1>
    <p>Polyglot learning with <strong>Java</strong> + <strong>JavaScript</strong>.</p>

    <div class="row">
      <div class="card">
        <h3>Java API</h3>
        <button id="call-java">Call /api/hello</button>
        <pre id="java-out">(waiting)</pre>
      </div>
      <div class="card">
        <h3>JS Microservice</h3>
        <button id="call-micro">Call /micro/ping</button>
        <pre id="micro-out">(waiting)</pre>
      </div>
      <div class="card">
        <h3>Labs</h3>
        <p>XSS demo: <a href="/xss/index.html">/xss/index.html</a></p>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
