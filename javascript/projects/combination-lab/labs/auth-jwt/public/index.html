<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Auth (JWT) Lab</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      input { width: 320px; }
      pre { background: #f5f5f5; padding: 0.75rem; border-radius: 8px; }
      .row { display: flex; gap: 1rem; align-items: center; }
    </style>
  </head>
  <body>
    <h1>Auth (JWT) Lab</h1>
    <p>Generate a JWT (HS256) and call the secure Java endpoint.</p>

    <div class="row">
      <label>Username (sub): <input id="username" placeholder="alice" /></label>
      <label>Secret: <input id="secret" value="dev-secret" /></label>
      <button id="gen">Generate Token</button>
    </div>

    <h3>Token</h3>
    <pre id="token">(none)</pre>

    <button id="call">Call /api/secure/hello</button>
    <h3>Response</h3>
    <pre id="out">(waiting)</pre>

    <script src="./app.js" type="module"></script>
  </body>
</html>
