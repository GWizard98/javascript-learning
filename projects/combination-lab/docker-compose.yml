version: "3.9"
services:
  backend-java:
    build:
      context: ./apps/backend-java
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  micro-js:
    build:
      context: ./apps/micro-js
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend-java:8080
    depends_on:
      - backend-java
    volumes:
      - ./apps/frontend/public:/usr/src/app/public:ro
      - ./labs/xss/public:/usr/src/app/public/xss:ro
      - ./labs/graphql/public:/usr/src/app/public/graphql:ro
